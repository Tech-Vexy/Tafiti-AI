[project]
name = "tafiti-backend"
version = "0.1.0"
description = "Tafiti AI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic[email]>=2.11.0",
    "pydantic-settings>=2.9.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.28.1",
    "requests>=2.32.0",
    "supabase>=2.31.0",
    "agno[arxiv,lancedb,openai,pdf,qdrant]>=2.8.0",
    "openai>=1.65.0",
    "google-genai>=2.0.0,<3",
    "ddgs>=9.0.0",
    "arxiv>=2.1.0",
    "parallel-web>=1.0.1",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.4.0",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "pypdf>=5.2.0",
    "pymupdf>=1.24.0",
    "python-json-logger>=3.2.0",
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
    "numpy>=1.26",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "mcp>=2.2.0",
    "sse-starlette>=3.0.0",
    "surrealdb>=2.0.0",
]

[tool.uv]
managed = true
