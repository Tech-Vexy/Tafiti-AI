    "requests>=2.32.0",
    "supabase>=2.31.0",
    "agno[arxiv,groq,lancedb,openai,pdf,qdrant]>=2.8.0",
    "openai>=1.65.0",
    "groq>=0.15.0",
    "google-genai>=2.0.0,<3",
    "ddgs>=9.0.0",
    "arxiv>=2.1.0",
    "parallel-web>=1.0.1",
