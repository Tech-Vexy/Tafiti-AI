# fly.toml app configuration file for Tafiti AI Backend
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "tafiti-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"
  DEBUG = "False"
  LOG_LEVEL = "INFO"
  DEFAULT_LLM_PROVIDER = "gemini"
  VECTOR_BACKEND = "pgvector"
  EMBEDDING_MODEL = "sentence-transformers/all-MiniLM-L6-v2"
  VECTOR_DIMENSION = "384"
  VECTOR_SEARCH_K = "5"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "30s"
    interval = "20s"
    method = "GET"
    timeout = "5s"
    path = "/health/live"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
